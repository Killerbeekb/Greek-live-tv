<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>OmeChat Live</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#111;color:#fff;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.h{background:#1e1e1e;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333}
.h h1{font-size:18px;color:#00e676}
#st{font-size:13px;color:#00e676;font-weight:bold}
.v{flex:1;display:flex;flex-direction:column;position:relative;background:#000}
.b{flex:1;position:relative;width:100%;height:50%;border-bottom:1px solid #222;overflow:hidden}
video{width:100%;height:100%;object-fit:cover}
#lv{transform:scaleX(-1)}
.l{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:12px;font-size:12px}
#cb{position:absolute;bottom:75px;left:10px;right:10px;max-height:120px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.m{background:rgba(0,0,0,.65);padding:5px 10px;border-radius:10px;font-size:13px;width:fit-content;max-width:85%}
.me{background:rgba(0,230,118,.25);align-self:flex-end}
.c{background:#1e1e1e;padding:10px;display:flex;flex-direction:column;gap:8px;border-top:1px solid #333}
.r{display:flex;gap:8px}
input{flex:1;background:#2c2c2c;border:none;color:#fff;padding:10px 14px;border-radius:20px;outline:none;font-size:14px}
button{border:none;border-radius:20px;padding:10px 16px;font-weight:bold;font-size:14px;cursor:pointer}
.bs{background:#2979ff;color:#fff}
.bn{flex:2;background:#00e676;color:#000;font-size:16px}
.bx{flex:1;background:#ff1744;color:#fff}
.br{background:#424242;color:#ffab40;font-size:12px;padding:6px 12px}
button:disabled{opacity:.5}
</style>
</head>
<body>
<div class="h"><h1>OmeChat Live</h1><span id="st">Έτοιμο V4</span><button class="br" onclick="rep()">⚠️ Report</button></div>
<div class="v">
<div class="b"><video id="rv" autoplay playsinline></video><div class="l">Ξένος</div></div>
<div class="b"><video id="lv" autoplay playsinline muted></video><div class="l" id="ml">Εσύ 🎤</div></div>
<div id="cb"></div>
</div>
<div class="c">
<div class="r"><input id="mi" placeholder="Γράψε μήνυμα..."><button class="bs" onclick="snd()">Αποστολή</button></div>
<div class="r"><button class="bn" onclick="go()">▶ Start / Next</button><button class="bx" id="xb" onclick="stp()" disabled>⏹ Stop</button></div>
</div>
<script src="https://gstatic.com"></script>
<script src="https://gstatic.com"></script>
<script>
const cfg={apiKey:"AIzaSyCC1PFUW9uLh-E1mc9Byk3GxlJqQYrbh_A",authDomain:"://firebaseapp.com",projectId:"greektv-4402e",storageBucket:"greektv-4402e.firebasestorage.app",messagingSenderId:"778988572064",appId:"1:778988572064:web:2fdf78082d7123eee0e8c5"};
let db=null,ls=null,pc=null,rid=null,ur=null,uc=null;
const st=document.getElementById('st'),lv=document.getElementById('lv'),rv=document.getElementById('rv'),cb=document.getElementById('cb'),ml=document.getElementById('ml'),id=Math.random().toString(36).substring(2,9);
const sv={iceServers:Array.of({urls:'stun:://google.com'})};
function gdb(){if(!db&&window.firebase){if(!firebase.apps.length)firebase.initializeApp(cfg);db=firebase.firestore();}return db;}
async function go(){
try{
if(!ls){
st.innerText="Άδεια μικροφώνου...";const as=await navigator.mediaDevices.getUserMedia({audio:true});
st.innerText="Άδεια κάμερας...";const vs=await navigator.mediaDevices.getUserMedia({video:true});
ls=new MediaStream();as.getAudioTracks().forEach(t=>ls.addTrack(t));vs.getVideoTracks().forEach(t=>ls.addTrack(t));
lv.srcObject=ls;ml.innerText="Εσύ 🎤 OK";
}
document.getElementById('xb').disabled=false;
if(!gdb()){st.innerText="Κάμερα/Μικρόφωνο ΟΚ";return;}
await cln();st.innerText="Αναζήτηση χρήστη...";cb.innerHTML="";
pc=new RTCPeerConnection(sv);ls.getTracks().forEach(t=>pc.addTrack(t,ls));
pc.ontrack=e=>{const s=e.streams.at(0);if(s){rv.srcObject=s;st.innerText="Συνδέθηκες!";}};
const sn=await db.collection('rooms').where('status','==','waiting').limit(1).get();
if(!sn.empty){
const d=sn.docs.at(0);rid=d.id;const rf=db.collection('rooms').doc(rid);
pc.onicecandidate=e=>{if(e.candidate)rf.collection('calleeCandidates').add(e.candidate.toJSON());};
await pc.setRemoteDescription(new RTCSessionDescription(d.data().offer));
const ans=await pc.createAnswer();await pc.setLocalDescription(ans);
await rf.update({answer:{type:ans.type,sdp:ans.sdp},status:'connected'});
rf.collection('callerCandidates').onSnapshot(s=>s.docChanges().forEach(c=>{if(c.type==='added')pc.addIceCandidate(new RTCIceCandidate(c.doc.data()));}));
ur=rf.onSnapshot(s=>{if(!s.exists)go();});lch(rf);
}else{
const rf=db.collection('rooms').doc();rid=rf.id;
pc.onicecandidate=e=>{if(e.candidate)rf.collection('callerCandidates').add(e.candidate.toJSON());};
const off=await pc.createOffer();await pc.setLocalDescription(off);
await rf.set({offer:{type:off.type,sdp:off.sdp},status:'waiting'});
ur=rf.onSnapshot(async s=>{const dt=s.data();if(!dt){go();return;}if(!pc.currentRemoteDescription&&dt.answer){await pc.setRemoteDescription(new RTCSessionDescription(dt.answer));st.innerText="Συνδέθηκες!";}});
rf.collection('calleeCandidates').onSnapshot(s=>s.docChanges().forEach(c=>{if(c.type==='added')pc.addIceCandidate(new RTCIceCandidate(c.doc.data()));}));
lch(rf);
}
}catch(e){st.innerText="Σφάλμα: "+e.message;alert(e.message);}
}
function lch(rf){uc=rf.collection('messages').orderBy('time').onSnapshot(s=>s.docChanges().forEach(c=>{if(c.type==='added'){const d=c.doc.data(),v=document.createElement('div');v.className='m'+(d.sender===id?' me':'');v.innerText=d.text;cb.appendChild(v);cb.scrollTop=cb.scrollHeight;}}));}
async function snd(){const i=document.getElementById('mi'),t=i.value.trim();if(!t||!rid||!db)return;i.value='';await db.collection('rooms').doc(rid).collection('messages').add({text:t,sender:id,time:Date.now()});}
async function cln(){if(ur){ur();ur=null;}if(uc){uc();uc=null;}if(pc){pc.close();pc=null;}rv.srcObject=null;if(rid&&db){try{await db.collection('rooms').doc(rid).delete();}catch(e){}rid=null;}}
async function stp(){await cln();st.innerText="Σταμάτησε";document.getElementById('xb').disabled=true;}
function rep(){alert("Η αναφορά καταχωρήθηκε.");go();}
</script>
</body>
</html>
